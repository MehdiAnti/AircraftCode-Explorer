name: Refresh OpenSky aircraft catalog and registry

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opensky-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run catalog tests
        run: python -m unittest discover -s tests -v

      - name: Download OpenSky metadata CSV
        env:
          OPENSKY_CSV_URL: https://opensky-network.org/datasets/metadata/aircraftDatabase.csv
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$OPENSKY_CSV_URL" \
            --output "$RUNNER_TEMP/aircraftDatabase.csv"
          test -s "$RUNNER_TEMP/aircraftDatabase.csv"

      - name: Import CSV into catalog and registry shards
        run: |
          python -m aircraft_explorer import-opensky \
            --metadata "$RUNNER_TEMP/aircraftDatabase.csv" \
            --output data/aircraft.json \
            --registry-dir "$RUNNER_TEMP/registry"

      - name: Validate generated catalog and registry shards
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          from aircraft_explorer.core import load_aircraft

          path = Path("data/aircraft.json")
          with path.open("r", encoding="utf-8") as file:
              payload = json.load(file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("Generated catalog must be a non-empty JSON array.")
          if any(not isinstance(record, dict) for record in payload):
              raise SystemExit("Generated catalog contains a non-object record.")
          records = load_aircraft(path)
          if len(records) != len(payload):
              raise SystemExit("Catalog validation changed the record count.")

          registry_dir = Path(__import__("os").environ["RUNNER_TEMP"]) / "registry"
          shard_files = list(registry_dir.glob("*/*.json.gz"))
          if not shard_files:
              raise SystemExit("No compressed registry search shards were generated.")
          shard_records = 0
          for shard in shard_files:
              with gzip.open(shard, "rt", encoding="utf-8") as file:
                  shard_data = json.load(file)
              if not isinstance(shard_data, list) or any(not isinstance(item, dict) for item in shard_data):
                  raise SystemExit(f"Invalid registry shard: {shard}")
              shard_records += len(shard_data)
          print(f"Validated {len(records):,} catalog records and {len(shard_files):,} registry shards ({shard_records:,} indexed entries).")
          PY

      - name: Commit model catalog JSON when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aircraft.json
          if git diff --cached --quiet; then
            echo "Model catalog JSON is unchanged; no commit is needed."
          else
            git commit -m "data: refresh OpenSky aircraft catalog"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/aircraft.json _site/data/aircraft.json
          cp -R "$RUNNER_TEMP/registry" _site/data/registry

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
