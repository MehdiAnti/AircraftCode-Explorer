name: Refresh OpenSky aircraft catalog and registry

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opensky-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run catalog tests
        run: python -m unittest discover -s tests -v

      - name: Download OpenSky metadata CSV
        env:
          OPENSKY_CSV_URL: https://opensky-network.org/datasets/metadata/aircraftDatabase.csv
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$OPENSKY_CSV_URL" \
            --output "$RUNNER_TEMP/aircraftDatabase.csv"
          test -s "$RUNNER_TEMP/aircraftDatabase.csv"

      - name: Rebuild tracked catalog, full registry, and search shards
        run: |
          mkdir -p data
          rm -rf data/registry data/airframes
          mkdir -p data/registry data/airframes
          python -m aircraft_explorer import-opensky \
            --metadata "$RUNNER_TEMP/aircraftDatabase.csv" \
            --output data/aircraft.json \
            --registry-dir data/registry
          mv data/registry/aircraft-registry.json.gz data/airframes.json.gz
          while IFS= read -r -d '' compressed; do
            gzip --decompress --stdout "$compressed" > "${compressed%.gz}"
          done < <(find data/registry -type f -name '*.json.gz' -print0)
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          source = Path("data/airframes.json.gz")
          target = Path("data/airframes.json")
          with gzip.open(source, "rt", encoding="utf-8") as file:
              records = json.load(file)
          payload = json.dumps(records, ensure_ascii=False, separators=(",", ":"))
          size = len(payload.encode("utf-8"))
          if size < 90 * 1024 * 1024:
              target.write_text(payload, encoding="utf-8")
              print(f"Created data/airframes.json ({size:,} bytes).")
          else:
              target.unlink(missing_ok=True)
              part_dir = Path("data/airframes")
              part_dir.mkdir(parents=True, exist_ok=True)
              chunk_size = 10000
              for index in range(0, len(records), chunk_size):
                  part = part_dir / f"part-{index // chunk_size + 1:05d}.json"
                  part.write_text(
                      json.dumps(records[index:index + chunk_size], ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )
              print(
                  f"Full JSON is {size:,} bytes; split {len(records):,} records "
                  f"into {len(list(part_dir.glob('part-*.json')))} JSON parts."
              )
          PY

      - name: Validate generated catalog, full registry export, and search shards
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          from aircraft_explorer.core import load_aircraft

          path = Path("data/aircraft.json")
          with path.open("r", encoding="utf-8") as file:
              payload = json.load(file)
          if not isinstance(payload, list) or not payload:
              raise SystemExit("Generated catalog must be a non-empty JSON array.")
          if any(not isinstance(record, dict) for record in payload):
              raise SystemExit("Generated catalog contains a non-object record.")
          records = load_aircraft(path)
          if len(records) != len(payload):
              raise SystemExit("Catalog validation changed the record count.")

          registry_dir = Path("data/registry")
          full_registry_path = Path("data/airframes.json.gz")
          if not full_registry_path.is_file() or full_registry_path.stat().st_size == 0:
              raise SystemExit("Full compressed aircraft registry export is missing or empty.")
          with gzip.open(full_registry_path, "rt", encoding="utf-8") as file:
              full_registry = json.load(file)
          if not isinstance(full_registry, list) or not full_registry:
              raise SystemExit("Full aircraft registry must be a non-empty JSON array.")
          if any(not isinstance(record, dict) for record in full_registry):
              raise SystemExit("Full aircraft registry contains a non-object record.")
          required_fields = ("icao24", "registration", "icao_type_designator", "operator")
          if any(not all(field in record for field in required_fields) for record in full_registry):
              raise SystemExit("Full aircraft registry records must include ICAO24, registration, type-code, and operator fields.")
          if not any(any(record.get(field) for field in required_fields) for record in full_registry):
              raise SystemExit("Full aircraft registry contains no ICAO24, registration, type-code, or operator values.")
          if full_registry_path.stat().st_size >= 90 * 1024 * 1024:
              raise SystemExit("Compressed registry is at least 90 MiB; refusing to commit a file that could approach GitHub's 100 MB per-file limit.")
          plain_shards = list(registry_dir.glob("*/*.json"))
          if len(plain_shards) != len(shard_files):
              raise SystemExit("Every compressed search shard must have an uncompressed JSON counterpart.")
          for shard in plain_shards:
              with shard.open("r", encoding="utf-8") as file:
                  plain_data = json.load(file)
              if not isinstance(plain_data, list) or any(not isinstance(item, dict) for item in plain_data):
                  raise SystemExit(f"Invalid plain JSON registry shard: {shard}")
          plain_full = Path("data/airframes.json")
          parts = sorted(Path("data/airframes").glob("part-*.json"))
          if plain_full.is_file():
              if plain_full.stat().st_size >= 90 * 1024 * 1024:
                  raise SystemExit("Full JSON registry exceeds the safe per-file size threshold.")
              if parts:
                  raise SystemExit("Do not publish both a full JSON registry and split parts.")
          elif not parts:
              raise SystemExit("Full JSON registry must exist or be split into JSON parts.")
          for part in parts:
              if part.stat().st_size >= 90 * 1024 * 1024:
                  raise SystemExit(f"JSON part exceeds the safe per-file size threshold: {part}")
          shard_files = list(registry_dir.glob("*/*.json.gz"))
          if not shard_files:
              raise SystemExit("No compressed registry search shards were generated.")
          for category in ("icao24", "registration", "typecode", "operator"):
              if not any((registry_dir / category).glob("*.json.gz")):
                  raise SystemExit(f"No search shards were generated for {category}.")
          shard_records = 0
          for shard in shard_files:
              with gzip.open(shard, "rt", encoding="utf-8") as file:
                  shard_data = json.load(file)
              if not isinstance(shard_data, list) or any(not isinstance(item, dict) for item in shard_data):
                  raise SystemExit(f"Invalid registry shard: {shard}")
              shard_records += len(shard_data)
          print(f"Validated {len(records):,} model catalog records, {len(full_registry):,} individual-aircraft registry records, and {len(shard_files):,} search shards ({shard_records:,} indexed entries).")
          PY

      - name: Commit refreshed catalog and registry files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/aircraft.json data/airframes.json data/airframes.json.gz data/airframes/ data/registry/
          if git diff --cached --quiet; then
            echo "Catalog and registry files are unchanged; no commit is needed."
          else
            git commit -m "data: refresh OpenSky catalog and aircraft registry"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Catalog and registry files pushed successfully."
                break
              fi

              echo "Push attempt $attempt failed; checking remote state."
              git fetch origin main

              if git merge-base --is-ancestor HEAD origin/main; then
                echo "The commit is already present on origin/main."
                break
              fi

              local_parent="$(git rev-parse HEAD^)"
              remote_head="$(git rev-parse origin/main)"
              if [ "$remote_head" != "$local_parent" ]; then
                echo "origin/main changed independently; refusing to overwrite it."
                exit 1
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "Push failed after 4 attempts."
                exit 1
              fi

              sleep "$((attempt * 10))"
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/aircraft.json _site/data/aircraft.json
          cp data/airframes.json.gz _site/data/airframes.json.gz
          gzip --decompress --stdout data/airframes.json.gz > _site/data/airframes.json
          test -s _site/data/airframes.json
          python -m json.tool _site/data/airframes.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          with Path("_site/data/aircraft.json").open("r", encoding="utf-8") as file:
              models = json.load(file)
          with Path("_site/data/airframes.json").open("r", encoding="utf-8") as file:
              airframes = json.load(file)
          if not isinstance(models, list) or not models:
              raise SystemExit("Published model catalog must be a non-empty JSON array.")
          if not isinstance(airframes, list) or not airframes:
              raise SystemExit("Published individual-aircraft registry must be a non-empty JSON array.")
          if any(not isinstance(record, dict) for record in models + airframes):
              raise SystemExit("Published JSON arrays must contain only objects.")
          required = ("icao24", "registration", "icao_type_designator", "operator")
          if any(not all(field in record for field in required) for record in airframes):
              raise SystemExit("Published airframe records must contain ICAO24, registration, type-code, and operator keys.")
          print(f"Validated published data: {len(models):,} models and {len(airframes):,} individual aircraft.")
          PY
          mkdir -p _site/data/registry
          cp -R data/registry/icao24 data/registry/registration data/registry/typecode data/registry/operator _site/data/registry/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
